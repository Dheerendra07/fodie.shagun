name: FoodieHub quality checks

on:
  push:
    branches:
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodiehub-quality-checks
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax and menu data
        run: |
          npm run check
          node -e "JSON.parse(require('fs').readFileSync('data/menu.json', 'utf8'))"

      - name: Run automated tests
        run: npm test
